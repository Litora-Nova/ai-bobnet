# Shared subscription login state. Provider credentials inherit aib-login via setgid.
d /var/lib/aib/login       2770 aib-broker aib-login   -
d /var/lib/aib/login-state 0700 aib-broker aib-broker -
d /run/aib/login-status    0755 aib-broker aib-broker -
d /run/aib/login           0750 aib-broker aib-gateway -
